<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --k-color: #e60012; --txt-color: #fff; }
        body { background: #111; color: #fff; font-family: "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* カード本体：背景の多層化 */
        #card-wrap { 
            width: 850px; height: 550px; border: 6px solid #000; overflow: hidden; position: relative; color: #000; 
            display: grid; grid-template-columns: 100px 1fr; box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            /* 層1: 新聞風の網掛けテクスチャ */
            background-color: #fcfcfc;
            background-image: radial-gradient(#ddd 0.5px, transparent 0.5px);
            background-size: 4px 4px;
        }

        .lane-box { background: var(--k-color); color: var(--txt-color); display: flex; align-items: center; justify-content: center; font-size: 85px; font-weight: 900; border-right: 6px solid #000; z-index: 20; position: relative; }

        /* メインエリア */
        .main-content { position: relative; display: grid; grid-template-rows: 140px 1fr 100px; z-index: 5; }
        
        /* 意匠：バンクの曲線とスピードライン */
        .bank-design {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 1; pointer-events: none;
            background: 
                linear-gradient(135deg, transparent 80%, rgba(0,0,0,0.05) 100%),
                radial-gradient(circle at 100% 100%, var(--k-color) 0%, transparent 40%);
            opacity: 0.15;
        }

        .silhouette-svg { position: absolute; right: -20px; bottom: 80px; width: 420px; opacity: 0.15; fill: var(--k-color); z-index: 2; transform: rotate(-3deg); }

        /* 各エリア：可読性のための背景 */
        .header { display: flex; align-items: center; padding: 0 30px; border-bottom: 5px solid #000; z-index: 10; gap: 20px; background: rgba(255,255,255,0.7); backdrop-filter: blur(2px); }
        .icon-frame { width: 95px; height: 95px; border-radius: 50%; border: 6px solid var(--k-color); overflow: hidden; background: #eee; flex-shrink: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .icon-frame img { width: 100%; height: 100%; object-fit: cover; }
        .name-area h1 { margin: 0; font-size: 44px; font-weight: 900; line-height: 1.1; letter-spacing: -1px; }
        .sub-info { font-size: 14px; font-weight: bold; color: #444; margin-top: 5px; display: flex; gap: 15px; }

        .data-grid { padding: 25px 35px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; z-index: 10; background: rgba(255,255,255,0.4); }
        .item { border-left: 6px solid var(--k-color); padding-left: 15px; }
        .label { font-size: 11px; color: #666; font-weight: 800; letter-spacing: 1px; }
        .val { font-size: 19px; font-weight: 800; color: #000; margin-top: 3px; }

        .footer-comment { border-top: 4px double #000; padding: 15px 35px; z-index: 10; background: rgba(255,255,255,0.85); font-size: 19px; font-weight: 900; line-height: 1.5; color: #222; overflow: hidden; }

        /* パネルエリア */
        .panel { width: 850px; margin-top: 25px; background: #222; padding: 30px; border-radius: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; border: 1px solid #444; }
        .input-group { display: flex; flex-direction: column; gap: 12px; }
        .lane-selector { grid-column: span 2; display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
        .c-btn { height: 42px; cursor: pointer; border: 1px solid #fff; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 4px; transition: 0.2s; }
        .c-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255,255,255,0.2); }
        .time-checks { display: flex; flex-wrap: wrap; gap: 12px; background: #333; padding: 10px; border-radius: 6px; }
        .time-checks label { color: #fff; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        label { font-size: 12px; font-weight: bold; color: #aaa; }
        input, select, textarea { padding: 12px; border-radius: 6px; border: none; background: #444; color: #fff; font-size: 14px; outline: none; }
        input:focus { background: #555; box-shadow: 0 0 0 2px var(--k-color); }
        textarea { height: 80px; resize: none; }
        .save-btn { grid-column: span 2; padding: 20px; background: #e60012; color: #fff; border: none; font-weight: 900; cursor: pointer; border-radius: 8px; font-size: 20px; box-shadow: 0 8px 20px rgba(230,0,18,0.4); margin-top: 10px; }
    </style>
</head>
<body>

<div id="card-wrap">
    <div class="lane-box" id="out-no">3</div>
    <div class="main-content">
        <div class="bank-design"></div>
        <svg class="silhouette-svg" viewBox="0 0 512 512"><path d="M430,230c-15-50-60-80-110-85l-40-5c-20-2-40,10-45,30l-10,40l-80,10c-15,2-25,15-22,30s15,25,30,22l70-10l5,40c2,15,15,25,30,22s25-15,22-30l-5-40l30,5c30,5,55,25,65,55l10,30h50L430,230z M150,350c-40,0-75,35-75,75s35,75,75,75s75-35,75-75S190,350,150,350z M150,470c-25,0-45-20-45-45s20-45,45-45s45,20,45,45S175,470,150,470z M380,350c-40,0-75,35-75,75s35,75,75,75s75-35,75-75S420,350,380,350z M380,470c-25,0-45-20-45-45s20-45,45-45s45,20,45,45S405,470,380,470z"/></svg>
        
        <div class="header">
            <div class="icon-frame"><img id="preview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ccc' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"></div>
            <div class="name-area">
                <h1 id="out-name">お名前を入力してください</h1>
                <div class="sub-info">
                    <span id="out-exp">競輪歴: ---</span>
                    <span id="out-sns1"></span>
                    <span id="out-sns2"></span>
                </div>
            </div>
        </div>
        <div class="data-grid">
            <div class="item"><span class="label">好きな脚質</span><div class="val" id="out-style">---</div></div>
            <div class="item"><span class="label">推しライン</span><div class="val" id="out-line">---</div></div>
            <div class="item"><span class="label">推し選手</span><div class="val" id="out-fav">---</div></div>
            <div class="item"><span class="label">主戦場 / 買い方</span><div class="val" id="out-battle">---</div></div>
            <div class="item" style="grid-column: span 2;"><span class="label">活動時間帯</span><div class="val" id="out-time">---</div></div>
        </div>
        <div class="footer-comment" id="out-comment">...よろしくお願いします</div>
    </div>
</div>

<div class="panel">
    <div class="lane-selector">
        <div class="c-btn" style="background:#fff; color:#000" onclick="chgLane(1,'#fff','#000')">1</div>
        <div class="c-btn" style="background:#000; color:#fff" onclick="chgLane(2,'#000','#fff')">2</div>
        <div class="c-btn" style="background:#f00; color:#fff" onclick="chgLane(3,'#f00','#fff')">3</div>
        <div class="c-btn" style="background:#00f; color:#fff" onclick="chgLane(4,'#00f','#fff')">4</div>
        <div class="c-btn" style="background:#ff0; color:#000" onclick="chgLane(5,'#ff0','#000')">5</div>
        <div class="c-btn" style="background:#080; color:#fff" onclick="chgLane(6,'#080','#fff')">6</div>
        <div class="c-btn" style="background:#f80; color:#fff" onclick="chgLane(7,'#f80','#fff')">7</div>
        <div class="c-btn" style="background:#fbc; color:#000" onclick="chgLane(8,'#fbc','#000')">8</div>
        <div class="c-btn" style="background:#808; color:#fff" onclick="chgLane(9,'#808','#fff')">9</div>
    </div>
    <div class="input-group">
        <label>基本情報</label>
        <input type="file" accept="image/*" onchange="loadImg(e)">
        <select id="in-g" onchange="upd()"><option value="?">性別</option><option value="♂">男性</option><option value="♀">女性</option></select>
        <input type="text" id="in-n" placeholder="お名前" oninput="upd()">
        <input type="text" id="in-exp" placeholder="競輪歴（例：5年）" oninput="upd()">
        <label>活動時間帯 (複数可)</label>
        <div class="time-checks">
            <label><input type="checkbox" value="モーニング" onchange="upd()">朝</label>
            <label><input type="checkbox" value="デイ" onchange="upd()">昼</label>
            <label><input type="checkbox" value="ナイター" onchange="upd()">夜</label>
            <label><input type="checkbox" value="ミッドナイト" onchange="upd()">深夜</label>
        </div>
    </div>
    <div class="input-group">
        <label>SNS 1 & 2</label>
        <div style="display:flex; gap:5px;"><select id="in-s1-p" onchange="upd()"><option value="X">X</option><option value="Discord">Discord</option><option value="TIP">TIP</option><option value="WT">WT</option></select><input type="text" id="in-s1-i" placeholder="ID" oninput="upd()" style="flex:1;"></div>
        <div style="display:flex; gap:5px;"><select id="in-s2-p" onchange="upd()"><option value="Discord">Discord</option><option value="X">X</option><option value="TIP">TIP</option><option value="WT">WT</option></select><input type="text" id="in-s2-i" placeholder="ID" oninput="upd()" style="flex:1;"></div>
        <label>属性情報</label>
        <select id="in-style" onchange="upd()"><option value="---">脚質</option><option value="逃げ">逃げ</option><option value="捲り">捲り</option><option value="追い込み">追い込み</option><option value="両">両</option></select>
        <select id="in-line" onchange="upd()"><option value="---">推しライン</option><option value="北日本">北日本</option><option value="関東">関東</option><option value="南関">南関</option><option value="中部">中部</option><option value="近畿">近畿</option><option value="中国">中国</option><option value="四国">四国</option><option value="九州">九州</option></select>
        <input type="text" id="in-fav" placeholder="推し選手" oninput="upd()">
        <input type="text" id="in-battle" placeholder="主戦場 / 買い方" oninput="upd()">
    </div>
    <div class="input-group" style="grid-column: span 2;">
        <label>一言コメント</label>
        <textarea id="in-com" placeholder="意気込みを入力してください..." oninput="upd()"></textarea>
    </div>
    <button class="save-btn" onclick="save()">画像を生成して保存するじゃ！！🫵</button>
</div>

<script>
    let isManualName = false;
    function chgLane(no, bg, txt) {
        document.documentElement.style.setProperty('--k-color', bg);
        document.documentElement.style.setProperty('--txt-color', txt);
        document.getElementById('out-no').innerText = no;
    }
    function loadImg(e) { document.getElementById('preview').src = URL.createObjectURL(e.target.files[0]); }
    function upd() {
        const g = document.getElementById('in-g').value, nInput = document.getElementById('in-n');
        if (nInput.value) isManualName = true;
        if (!isManualName && g !== "?") nInput.value = (g === "♂" ? "John Doe" : "Jane Doe");
        document.getElementById('out-name').innerText = nInput.value || "お名前を入力してください";
        document.getElementById('out-exp').innerText = "競輪歴: " + (document.getElementById('in-exp').value || "---");
        const s1p = document.getElementById('in-s1-p').value, s1i = document.getElementById('in-s1-i').value;
        const s2p = document.getElementById('in-s2-p').value, s2i = document.getElementById('in-s2-i').value;
        document.getElementById('out-sns1').innerText = s1i ? s1p + ": " + s1i : "";
        document.getElementById('out-sns2').innerText = s2i ? s2p + ": " + s2i : "";
        document.getElementById('out-style').innerText = document.getElementById('in-style').value;
        document.getElementById('out-line').innerText = document.getElementById('in-line').value;
        document.getElementById('out-fav').innerText = document.getElementById('in-fav').value || "---";
        document.getElementById('out-battle').innerText = document.getElementById('in-battle').value || "---";
        document.getElementById('out-comment').innerText = document.getElementById('in-com').value || "...よろしくお願いします";
        const times = Array.from(document.querySelectorAll('.time-checks input:checked')).map(c => c.value);
        document.getElementById('out-time').innerText = times.length ? times.join(' / ') : "---";
    }
    function save() {
        const btn = document.querySelector('.save-btn');
        btn.innerText = "生成中...";
        html2canvas(document.querySelector("#card-wrap"), { scale: 3, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'keirin-identity-premium.png';
            link.href = canvas.toDataURL();
            link.click();
            btn.innerText = "画像を生成して保存するじゃ！！🫵";
        });
    }
</script>
</body>
</html>
