<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --k-color: #e60012; --txt-color: #fff; }
        body { background: #000; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* プレビューエリア */
        .card-container { width: 100%; height: 38vh; background: #000; display: flex; justify-content: center; align-items: center; flex-shrink: 0; border-bottom: 3px solid #333; overflow: hidden; }
        #card-wrap { 
            width: 850px; height: 580px; border: 6px solid #000; overflow: hidden; position: relative; color: #000; 
            display: grid; grid-template-columns: 100px 1fr; background: #fdfdfd; flex-shrink: 0;
        }

        /* バンク・カント・シルエットの意匠 */
        .bg-design { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .bank-line { position: absolute; top: 0; right: 0; width: 100%; height: 100%; background: #eee; clip-path: polygon(30% 0, 100% 0, 100% 100%, 0% 100%); opacity: 0.5; }
        .dot-pattern { position: absolute; inset: 0; background-image: radial-gradient(#bbb 1px, transparent 1px); background-size: 15px 15px; opacity: 0.3; }
        .racer-silhouette { position: absolute; bottom: -20px; right: -20px; width: 450px; height: 450px; opacity: 0.15; filter: grayscale(1); }

        /* コンテンツ */
        .lane-box { background: var(--k-color); color: var(--txt-color); display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 900; border-right: 6px solid #000; z-index: 10; }
        .main-content { display: grid; grid-template-rows: 140px 1fr 100px; z-index: 5; }
        .header { display: flex; align-items: center; padding: 0 30px; border-bottom: 5px solid #000; gap: 20px; background: rgba(255,255,255,0.8); }
        .icon-frame { width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--k-color); overflow: hidden; flex-shrink: 0; background: #fff; }
        .icon-frame img { width: 100%; height: 100%; object-fit: cover; }
        .name-area h1 { margin: 0; font-size: 48px; font-weight: 900; line-height: 1; }
        .sub-info { font-size: 14px; font-weight: bold; color: #333; margin-top: 8px; }

        .data-grid { padding: 20px 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .category-label { grid-column: span 2; font-size: 14px; font-weight: 900; color: #fff; background: #000; padding: 3px 12px; margin-bottom: 5px; }
        .item { border-left: 6px solid var(--k-color); padding-left: 12px; }
        .label { font-size: 11px; color: #555; font-weight: 800; display: block; }
        .val { font-size: 18px; font-weight: 900; color: #000; }
        .footer-comment { border-top: 5px solid #000; padding: 15px 30px; background: #fff; font-size: 20px; font-weight: 800; display: flex; align-items: center; }

        /* 入力パネル */
        .panel { width: 100%; flex-grow: 1; overflow-y: auto; background: #111; padding: 25px; box-sizing: border-box; display: flex; flex-direction: column; gap: 25px; }
        .input-block { display: flex; flex-direction: column; gap: 15px; padding: 20px; background: #1a1a1a; border-radius: 12px; border: 1px solid #333; }
        .check-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: #222; padding: 15px; border-radius: 8px; }
        .check-grid label { display: flex; align-items: center; color: #fff; font-size: 13px; font-weight: bold; }
        label.g-title { font-size: 13px; font-weight: 900; color: var(--k-color); border-left: 4px solid var(--k-color); padding-left: 10px; }
        input, select, textarea { padding: 14px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; width: 100%; box-sizing: border-box; }
        .save-btn { padding: 25px; background: #e60012; color: #fff; border: none; font-weight: 900; cursor: pointer; border-radius: 15px; font-size: 20px; margin-bottom: 60px; }

        @media screen and (orientation: landscape) {
            body { flex-direction: row; }
            .card-container { width: 50%; height: 100vh; border-bottom: none; border-right: 3px solid #333; }
            .panel { width: 50%; height: 100vh; }
        }
    </style>
</head>
<body>

<div class="card-container">
    <div id="card-wrap">
        <div class="bg-design">
            <div class="dot-pattern"></div>
            <div class="bank-line"></div>
            <svg class="racer-silhouette" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.5,9.5c0.8,0,1.5,0.7,1.5,1.5s-0.7,1.5-1.5,1.5S18,11.8,18,11S18.7,9.5,19.5,9.5z M12,2C6.5,2,2,6.5,2,12s4.5,10,10,10s10-4.5,10-10S17.5,2,12,2z M17.2,17.2c-0.3,0.3-0.8,0.3-1.1,0l-1.4-1.4c-1.3,0.8-2.9,1.2-4.7,1.2c-4.4,0-8-3.6-8-8c0-1.8,0.6-3.4,1.6-4.7l-1.1-1.1c-0.3-0.3-0.3-0.8,0-1.1c0.3-0.3,0.8-0.3,1.1,0l13.6,13.6C17.5,16.4,17.5,16.9,17.2,17.2z"/></svg>
        </div>
        <div class="lane-box" id="out-no">1</div>
        <div class="main-content">
            <div class="header">
                <div class="icon-frame"><img id="preview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ccc' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"></div>
                <div class="name-area"><h1 id="out-name">ジョン・ドゥ</h1><div class="sub-info"><span id="out-exp">歴: ---</span></div></div>
            </div>
            <div class="data-grid">
                <div class="category-label">戦術 & 属性</div>
                <div class="item"><span class="label">脚質 / 推し選手</span><div class="val" id="out-style-fav">---</div></div>
                <div class="item"><span class="label">推しライン</span><div class="val" id="out-line">---</div></div>
                <div class="item"><span class="label">主戦場 (BANK)</span><div class="val" id="out-bank">---</div></div>
                <div class="category-label">戦域 (TARGET RACES)</div>
                <div class="item"><span class="label">時間帯</span><div class="val" id="out-time">---</div></div>
                <div class="item"><span class="label">格 (GRADE)</span><div class="val" id="out-grade">---</div></div>
            </div>
            <div class="footer-comment"><span id="out-comment">...よろしくお願いします</span></div>
        </div>
    </div>
</div>

<div class="panel">
    <div class="input-block">
        <label class="g-title">車番色 & 性別</label>
        <div style="display:grid; grid-template-columns: repeat(9, 1fr); gap:4px;">
            <div class="c-btn" style="background:#fff; color:#000; height:35px; cursor:pointer; font-weight:900; display:flex; align-items:center; justify-content:center; border:1px solid #444;" onclick="chgLane(1,'#fff','#000')">1</div>
            <div class="c-btn" style="background:#000; color:#fff; height:35px; cursor:pointer; font-weight:900; display:flex; align-items:center; justify-content:center;" onclick="chgLane(2,'#000','#fff')">2</div>
            <div class="c-btn" style="background:#f00; color:#fff; height:35px; cursor:pointer; font-weight:900; display:flex; align-items:center; justify-content:center;" onclick="chgLane(3,'#f00','#fff')">3</div>
            <div class="c-btn" style="background:#00f; color:#fff; height:35px; cursor:pointer; font-weight:900; display:flex; align-items:center; justify-content:center;" onclick="chgLane(4,'#00f','#fff')">4</div>
            <div class="c-btn" style="background:#dcb000; color:#000; height:35px; cursor:pointer; font-weight:900; display:flex; align-items:center; justify-content:center;" onclick="chgLane(5,'#dcb000','#000')">5</div>
            <div class="c-btn" style="background:#080; color:#fff; height:35px; cursor:pointer; font-weight:900; display:flex; align-items:center; justify-content:center;" onclick="chgLane(6,'#080','#fff')">6</div>
            <div class="c-btn" style="background:#f80; color:#fff; height:35px; cursor:pointer; font-weight:900; display:flex; align-items:center; justify-content:center;" onclick="chgLane(7,'#f80','#fff')">7</div>
            <div class="c-btn" style="background:#fbc; color:#000; height:35px; cursor:pointer; font-weight:900; display:flex; align-items:center; justify-content:center;" onclick="chgLane(8,'#fbc','#000')">8</div>
            <div class="c-btn" style="background:#808; color:#fff; height:35px; cursor:pointer; font-weight:900; display:flex; align-items:center; justify-content:center;" onclick="chgLane(9,'#808','#fff')">9</div>
        </div>
        <select id="in-gender" onchange="chgGender()">
            <option value="male">男性 (ジョン・ドゥ)</option>
            <option value="female">女性 (ジェーン・ドゥ)</option>
        </select>
        <input type="file" accept="image/*" onchange="loadImg(event)">
        <input type="text" id="in-n" placeholder="お名前" oninput="upd()">
        <input type="text" id="in-exp" placeholder="競輪歴" oninput="upd()">
    </div>
    
    <div class="input-block">
        <label class="g-title">脚質 & 推し</label>
        <select id="in-style" onchange="upd()">
            <option value="---">脚質を選択</option>
            <option value="逃げ">逃げ</option><option value="捲り">捲り</option><option value="差し">差し</option><option value="マーク">マーク</option>
        </select>
        <input type="text" id="in-fav" placeholder="推し選手" oninput="upd()">
        <input type="text" id="in-line" placeholder="推しライン" oninput="upd()">
        <input type="text" id="in-bank" placeholder="好きなバンク" oninput="upd()">
    </div>

    <div class="input-block">
        <label class="g-title">主戦域 (時間帯)</label>
        <div class="check-grid" id="time-grp">
            <label><input type="checkbox" value="モーニング" onchange="upd()">モーニング</label>
            <label><input type="checkbox" value="デイ" onchange="upd()">デイ</label>
            <label><input type="checkbox" value="ナイター" onchange="upd()">ナイター</label>
            <label><input type="checkbox" value="ミッド" onchange="upd()">ミッド</label>
        </div>
    </div>

    <div class="input-block">
        <label class="g-title">グレード</label>
        <div class="check-grid" id="grade-grp">
            <label><input type="checkbox" value="GP" onchange="upd()">GP</label><label><input type="checkbox" value="G1" onchange="upd()">G1</label><label><input type="checkbox" value="G2" onchange="upd()">G2</label><label><input type="checkbox" value="G3" onchange="upd()">G3</label><label><input type="checkbox" value="F1" onchange="upd()">F1</label><label><input type="checkbox" value="F2" onchange="upd()">F2</label><label><input type="checkbox" value="L1" onchange="upd()">L1</label>
        </div>
    </div>

    <textarea id="in-com" placeholder="一言メッセージ..." oninput="upd()"></textarea>
    <button class="save-btn" onclick="save()">画像化して保存する📸</button>
</div>

<script>
    let currentGender = "male";
    function chgGender() {
        currentGender = document.getElementById('in-gender').value;
        const nameInput = document.getElementById('in-n');
        if(!nameInput.value || nameInput.value === "ジョン・ドゥ" || nameInput.value === "ジェーン・ドゥ") {
            nameInput.value = currentGender === "male" ? "ジョン・ドゥ" : "ジェーン・ドゥ";
        }
        upd();
    }
    function adjustScale() {
        const container = document.querySelector('.card-container');
        const card = document.getElementById('card-wrap');
        const isLandscape = window.innerWidth > window.innerHeight;
        const scale = isLandscape ? (container.offsetHeight * 0.9) / 580 : (container.offsetWidth * 0.95) / 850;
        card.style.transform = `scale(${Math.min(scale, 1)})`;
    }
    window.addEventListener('resize', adjustScale);
    window.addEventListener('load', adjustScale);
    function chgLane(no, bg, txt) { document.documentElement.style.setProperty('--k-color', bg); document.documentElement.style.setProperty('--txt-color', txt); document.getElementById('out-no').innerText = no; }
    function loadImg(e) { document.getElementById('preview').src = URL.createObjectURL(e.target.files[0]); }
    function upd() {
        const defName = currentGender === "male" ? "ジョン・ドゥ" : "ジェーン・ドゥ";
        document.getElementById('out-name').innerText = document.getElementById('in-n').value || defName;
        document.getElementById('out-exp').innerText = "歴: " + (document.getElementById('in-exp').value || "---");
        document.getElementById('out-style-fav').innerText = document.getElementById('in-style').value + " / " + (document.getElementById('in-fav').value || "---");
        document.getElementById('out-line').innerText = document.getElementById('in-line').value || "---";
        document.getElementById('out-bank').innerText = document.getElementById('in-bank').value || "---";
        document.getElementById('out-comment').innerText = document.getElementById('in-com').value || "...よろしくお願いします";
        const ts = Array.from(document.querySelectorAll('#time-grp input:checked')).map(c => c.value);
        document.getElementById('out-time').innerText = ts.length ? ts.join('/') : "---";
        const gs = Array.from(document.querySelectorAll('#grade-grp input:checked')).map(c => c.value);
        document.getElementById('out-grade').innerText = gs.length ? gs.join('/') : "---";
    }
    function save() { 
        html2canvas(document.querySelector("#card-wrap"), { scale: 3, useCORS: true, width: 850, height: 580 }).then(canvas => {
            const link = document.createElement('a'); link.download = 'keirin-card-ultimate.png'; link.href = canvas.toDataURL(); link.click();
        });
    }
</script>
</body>
</html>
