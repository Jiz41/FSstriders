<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --k-color: #e60012; --txt-color: #fff; }
        body { 
            background: #111; color: #fff; font-family: sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 0; margin: 0; min-height: 100vh;
        }
        
        /* プレビューコンテナ */
        .card-container { 
            width: 100%; max-width: 850px; overflow: hidden; display: flex; justify-content: center; 
            background: #000; padding: 10px 0; position: sticky; top: 0; z-index: 100;
        }
        
        #card-wrap { 
            width: 850px; height: 580px; border: 6px solid #000; overflow: hidden; position: relative; color: #000; 
            display: grid; grid-template-columns: 100px 1fr; flex-shrink: 0;
            background-color: #f8f8f8; background-image: radial-gradient(#ccc 0.5px, transparent 0.5px); background-size: 5px 5px;
            transform-origin: top center;
        }

        /* ケンさんの「字面」パーツ群 */
        .lane-box { background: var(--k-color); color: var(--txt-color); display: flex; align-items: center; justify-content: center; font-size: 90px; font-weight: 900; border-right: 6px solid #000; z-index: 20; }
        .main-content { position: relative; display: grid; grid-template-rows: 140px 1fr 110px; z-index: 5; }
        .header { display: flex; align-items: center; padding: 0 30px; border-bottom: 5px solid #000; z-index: 10; gap: 20px; background: rgba(255,255,255,0.8); }
        .icon-frame { width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--k-color); overflow: hidden; background: #eee; flex-shrink: 0; }
        .icon-frame img { width: 100%; height: 100%; object-fit: cover; }
        .name-area h1 { margin: 0; font-size: 46px; font-weight: 900; line-height: 1; letter-spacing: -2px; }
        .sub-info { font-size: 13px; font-weight: bold; color: #333; margin-top: 8px; display: flex; gap: 12px; }
        .data-grid { padding: 20px 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; z-index: 10; }
        .category-label { grid-column: span 2; font-size: 14px; font-weight: 900; color: #fff; background: #000; padding: 2px 10px; margin-top: 5px; }
        .item { border-left: 6px solid var(--k-color); padding-left: 12px; }
        .label { font-size: 10px; color: #777; font-weight: 800; }
        .val { font-size: 18px; font-weight: 900; color: #000; }
        .footer-comment { border-top: 5px solid #000; padding: 15px 30px; z-index: 10; background: #fff; font-size: 18px; font-weight: 900; line-height: 1.4; position: relative; }
        .copyright { position: absolute; bottom: 5px; right: 10px; font-size: 10px; font-weight: bold; color: #aaa; z-index: 15; }

        /* 操作パネル */
        .panel { 
            width: 100%; max-width: 500px; background: #1a1a1a; padding: 20px; 
            display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; 
        }
        .lane-selector { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
        .c-btn { height: 35px; cursor: pointer; border: 1px solid #444; font-weight: 900; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-size: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #2a2a2a; padding: 10px; border-radius: 6px; }
        .check-grid label { color: #fff; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        label.g-title { font-size: 11px; font-weight: 900; color: var(--k-color); margin-top: 5px; }
        input, select, textarea { padding: 10px; border-radius: 6px; border: none; background: #2a2a2a; color: #fff; font-size: 16px; width: 100%; box-sizing: border-box; }
        textarea { height: 80px; resize: none; }
        .save-btn { padding: 18px; background: #e60012; color: #fff; border: none; font-weight: 900; cursor: pointer; border-radius: 12px; font-size: 18px; }

        /* 【重要】横画面（ランドスケープ）時のレイアウト */
        @media screen and (orientation: landscape) and (max-height: 600px) {
            body { flex-direction: row; align-items: flex-start; }
            .card-container { 
                width: 50%; height: 100vh; position: sticky; top: 0; 
                padding: 0; display: flex; align-items: center; 
            }
            #card-wrap { transform-origin: center center; }
            .panel { width: 50%; max-width: none; height: 100vh; overflow-y: auto; padding-bottom: 50px; }
            .lane-selector { grid-template-columns: repeat(5, 1fr); }
        }
    </style>
</head>
<body>

<div class="card-container">
    <div id="card-wrap">
        <div class="lane-box" id="out-no">3</div>
        <div class="main-content">
            <div class="header">
                <div class="icon-frame"><img id="preview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ccc' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"></div>
                <div class="name-area"><h1 id="out-name">お名前</h1><div class="sub-info"><span id="out-exp">歴: ---</span> / <span id="out-sns1"></span></div></div>
            </div>
            <div class="data-grid">
                <div class="category-label">戦術 & 属性</div>
                <div class="item"><span class="label">好きな脚質 / 推し選手</span><div class="val" id="out-style-fav">---</div></div>
                <div class="item"><span class="label">推しライン</span><div class="val" id="out-line">---</div></div>
                <div class="item"><span class="label">主戦場 (BANK)</span><div class="val" id="out-bank">---</div></div>
                <div class="item"><span class="label">車券戦術 (STYLE)</span><div class="val" id="out-bet">---</div></div>
                <div class="category-label">戦域 (TARGET RACES)</div>
                <div class="item"><span class="label">時間帯</span><div class="val" id="out-time">---</div></div>
                <div class="item"><span class="label">格 (GRADE)</span><div class="val" id="out-grade">---</div></div>
            </div>
            <div class="footer-comment">
                <span id="out-comment">...よろしくお願いします</span>
                <div class="copyright">(C)Mushyn Reagan</div>
            </div>
        </div>
    </div>
</div>

<div class="panel">
    <div class="lane-selector">
        <div class="c-btn" style="background:#fff; color:#000" onclick="chgLane(1,'#fff','#000')">1</div>
        <div class="c-btn" style="background:#000; color:#fff" onclick="chgLane(2,'#000','#fff')">2</div>
        <div class="c-btn" style="background:#f00; color:#fff" onclick="chgLane(3,'#f00','#fff')">3</div>
        <div class="c-btn" style="background:#00f; color:#fff" onclick="chgLane(4,'#00f','#fff')">4</div>
        <div class="c-btn" style="background:#dcb000; color:#000" onclick="chgLane(5,'#dcb000','#000')">5</div>
        <div class="c-btn" style="background:#080; color:#fff" onclick="chgLane(6,'#080','#fff')">6</div>
        <div class="c-btn" style="background:#f80; color:#fff" onclick="chgLane(7,'#f80','#fff')">7</div>
        <div class="c-btn" style="background:#fbc; color:#000" onclick="chgLane(8,'#fbc','#000')">8</div>
        <div class="c-btn" style="background:#808; color:#fff" onclick="chgLane(9,'#808','#fff')">9</div>
    </div>
    
    <div class="input-group">
        <label class="g-title">基本 & SNS</label>
        <input type="file" accept="image/*" onchange="loadImg(event)">
        <input type="text" id="in-n" placeholder="お名前" oninput="upd()">
        <input type="text" id="in-exp" placeholder="競輪歴" oninput="upd()">
        <div style="display:flex; gap:5px;"><select id="in-s1-p" onchange="upd()" style="width:70px;"><option value="X">X</option><option value="Disc">Disc</option></select><input type="text" id="in-s1-i" placeholder="ID" oninput="upd()"></div>
        
        <label class="g-title">戦術 & 属性</label>
        <select id="in-style" onchange="upd()"><option value="---">脚質</option><option value="逃げ">逃げ</option><option value="捲り">捲り</option><option value="追込">追込</option></select>
        <input type="text" id="in-fav" placeholder="推し選手" oninput="upd()">
        <input type="text" id="in-line" placeholder="推しライン" oninput="upd()">
        <input type="text" id="in-bank" placeholder="好きなバンク" oninput="upd()">
        <input type="text" id="in-bet" placeholder="車券の買い方" oninput="upd()">
        
        <label class="g-title">主戦域</label>
        <div class="check-grid" id="time-grp">
            <label><input type="checkbox" value="モーニング" onchange="upd()">モーニング</label><label><input type="checkbox" value="デイ" onchange="upd()">デイ</label>
            <label><input type="checkbox" value="ナイター" onchange="upd()">ナイター</label><label><input type="checkbox" value="ミッド" onchange="upd()">ミッド</label>
        </div>
        <div class="check-grid" id="grade-grp">
            <label><input type="checkbox" value="GP" onchange="upd()">GP</label><label><input type="checkbox" value="G1" onchange="upd()">G1</label>
            <label><input type="checkbox" value="F1" onchange="upd()">F1</label><label><input type="checkbox" value="F2" onchange="upd()">F2</label>
        </div>
    </div>
    <textarea id="in-com" placeholder="短評を入力..." oninput="upd()"></textarea>
    <button class="save-btn" onclick="save()">画像化して保存する📸</button>
</div>

<script>
    function adjustScale() {
        const container = document.querySelector('.card-container');
        const card = document.getElementById('card-wrap');
        const isLandscape = window.innerWidth > window.innerHeight;
        const targetWidth = isLandscape ? container.offsetWidth : container.offsetWidth;
        const scale = targetWidth / 850;
        
        if (scale < 1) {
            card.style.transform = `scale(${scale})`;
            if(!isLandscape) container.style.height = (580 * scale) + "px";
            else container.style.height = "100vh";
        } else {
            card.style.transform = "none";
            container.style.height = isLandscape ? "100vh" : "580px";
        }
    }
    window.addEventListener('resize', adjustScale);
    window.addEventListener('load', adjustScale);

    function chgLane(no, bg, txt) { document.documentElement.style.setProperty('--k-color', bg); document.documentElement.style.setProperty('--txt-color', txt); document.getElementById('out-no').innerText = no; }
    function loadImg(e) { document.getElementById('preview').src = URL.createObjectURL(e.target.files[0]); }
    function upd() {
        document.getElementById('out-name').innerText = document.getElementById('in-n').value || "お名前";
        document.getElementById('out-exp').innerText = "歴: " + (document.getElementById('in-exp').value || "---");
        document.getElementById('out-sns1').innerText = document.getElementById('in-s1-i').value ? document.getElementById('in-s1-p').value + ":" + document.getElementById('in-s1-i').value : "";
        document.getElementById('out-style-fav').innerText = document.getElementById('in-style').value + " / " + (document.getElementById('in-fav').value || "---");
        document.getElementById('out-line').innerText = document.getElementById('in-line').value || "---";
        document.getElementById('out-bank').innerText = document.getElementById('in-bank').value || "---";
        document.getElementById('out-bet').innerText = document.getElementById('in-bet').value || "---";
        document.getElementById('out-comment').innerText = document.getElementById('in-com').value || "...よろしくお願いします";
        const ts = Array.from(document.querySelectorAll('#time-grp input:checked')).map(c => c.value);
        document.getElementById('out-time').innerText = ts.length ? ts.join('/') : "---";
        const gs = Array.from(document.querySelectorAll('#grade-grp input:checked')).map(c => c.value);
        document.getElementById('out-grade').innerText = gs.length ? gs.join('/') : "---";
    }
    function save() { 
        const btn = document.querySelector('.save-btn'); btn.innerText = "生成中...";
        html2canvas(document.querySelector("#card-wrap"), { scale: 3, useCORS: true, width: 850, height: 580 }).then(canvas => {
            const link = document.createElement('a'); link.download = 'keirin-mushyn-land.png'; link.href = canvas.toDataURL(); link.click();
            btn.innerText = "画像化して保存する📸";
        });
    }
</script>
</body>
</html>
