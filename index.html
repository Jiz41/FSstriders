<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        :root { --k-color: #e60012; } /* 3枠赤をデフォルトに */
        body { background: #333; display: flex; flex-direction: column; align-items: center; padding: 40px; font-family: "MS UI Gothic", "Meiryo", sans-serif; }

        /* カード本体：出走表の質感をCSSだけで再現 */
        #card {
            width: 800px; height: 450px; background: #fff;
            border: 4px solid #000; position: relative;
            display: grid; grid-template-columns: 80px 1fr 220px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        }

        /* 左端：車番エリア（CSSの巨大数字） */
        .lane-no {
            background: var(--k-color); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; font-weight: bold; border-right: 4px solid #000;
            text-shadow: 2px 2px 0 #000;
        }

        /* 中央：メイン情報 */
        .main-info { display: grid; grid-template-rows: 140px 1fr; }
        .name-box { border-bottom: 4px solid #000; padding: 20px; position: relative; overflow: hidden; }
        .name-box h1 { margin: 0; font-size: 56px; line-height: 1; letter-spacing: -2px; }
        .name-label { position: absolute; top: 5px; left: 10px; font-size: 12px; font-weight: bold; }

        /* 背景に流れるCSSの「バンクライン」 */
        .bank-line {
            position: absolute; right: -50px; bottom: -50px;
            width: 300px; height: 300px; border: 40px solid var(--k-color);
            border-radius: 50%; opacity: 0.1; pointer-events: none;
        }

        .details { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .data-item { border-left: 4px solid var(--k-color); padding-left: 10px; margin-bottom: 15px; }
        .label { font-size: 12px; color: #666; display: block; }
        .val { font-size: 20px; font-weight: bold; color: #000; }

        /* 右端：戦歴・短評エリア */
        .sidebar { border-left: 4px solid #000; background: #f0f0f0; padding: 15px; }
        .comment-box { height: 100%; border: 2px dashed #999; padding: 10px; font-size: 14px; line-height: 1.6; }

        /* 操作用ボタン */
        .controls { margin-top: 30px; display: flex; gap: 10px; }
        .c-btn { width: 40px; height: 40px; border: 2px solid #000; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="card">
    <div class="lane-no" id="out-no">3</div>
    <div class="main-info">
        <div class="name-box">
            <span class="name-label">NAME</span>
            <h1 id="out-name">Alphabet</h1>
            <div class="bank-line"></div>
        </div>
        <div class="details">
            <div class="data-item"><span class="label">性別 / GENDER</span><span class="val" id="out-g">John Doe / ♂</span></div>
            <div class="data-item"><span class="label">脚質 / STYLE</span><span class="val">逃げ・両</span></div>
            <div class="data-item"><span class="label">ホーム / BANK</span><span class="val">向日町</span></div>
            <div class="data-item"><span class="label">競輪歴 / EXP</span><span class="val">12年</span></div>
        </div>
    </div>
    <div class="sidebar">
        <span class="label">短評 / COMMENT</span>
        <div class="comment-box">
            本命党ながら、時折見せる大穴狙いに定評あり。展開予想を重視する硬派な車券師スタイル。
        </div>
    </div>
</div>

<div class="controls">
    <div class="c-btn" style="background:#fff; color:#000" onclick="setLane(1, '#fff', '#000')">1</div>
    <div class="c-btn" style="background:#000; color:#fff" onclick="setLane(2, '#000', '#fff')">2</div>
    <div class="c-btn" style="background:#f00; color:#fff" onclick="setLane(3, '#f00', '#fff')">3</div>
    <div class="c-btn" style="background:#00f; color:#fff" onclick="setLane(4, '#00f', '#fff')">4</div>
    <div class="c-btn" style="background:#ff0; color:#000" onclick="setLane(5, '#ff0', '#000')">5</div>
    <div class="c-btn" style="background:#080; color:#fff" onclick="setLane(6, '#080', '#fff')">6</div>
    <div class="c-btn" style="background:#f80; color:#fff" onclick="setLane(7, '#f80', '#fff')">7</div>
    <div class="c-btn" style="background:#fbc; color:#000" onclick="setLane(8, '#fbc', '#000')">8</div>
    <div class="c-btn" style="background:#808; color:#fff" onclick="setLane(9, '#808', '#fff')">9</div>
</div>

<script>
    function setLane(no, bg, txt) {
        const root = document.documentElement;
        root.style.setProperty('--k-color', bg);
        const lane = document.getElementById('out-no');
        lane.innerText = no;
        lane.style.color = txt;
    }
</script>

</body>
</html>
