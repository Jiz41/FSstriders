<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --k-color: #e60012; --txt-color: #fff; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* プレビュー：完全に独立した上部固定エリア */
        .card-container { 
            width: 100%; height: 38vh; background: #000; display: flex; justify-content: center; align-items: center; 
            flex-shrink: 0; border-bottom: 3px solid #444; overflow: hidden;
        }
        #card-wrap { 
            width: 850px; height: 580px; border: 4px solid #000; overflow: hidden; position: relative; color: #000; 
            display: grid; grid-template-columns: 100px 1fr; background-color: #f8f8f8; 
            background-image: radial-gradient(#ccc 0.5px, transparent 0.5px); background-size: 5px 5px; 
            flex-shrink: 0; /* サイズ崩れ防止 */
        }

        /* カード内部のデザイン（1000000800.pngの惨状を修復） */
        .lane-box { background: var(--k-color); color: var(--txt-color); display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 900; border-right: 4px solid #000; }
        .main-content { display: grid; grid-template-rows: 130px 1fr 100px; }
        .header { display: flex; align-items: center; padding: 0 25px; border-bottom: 4px solid #000; gap: 15px; background: rgba(255,255,255,0.9); }
        .icon-frame { width: 90px; height: 90px; border-radius: 50%; border: 5px solid var(--k-color); overflow: hidden; flex-shrink: 0; }
        .icon-frame img { width: 100%; height: 100%; object-fit: cover; }
        .name-area h1 { margin: 0; font-size: 42px; font-weight: 900; }
        .data-grid { padding: 15px 25px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .category-label { grid-column: span 2; font-size: 13px; font-weight: 900; color: #fff; background: #000; padding: 2px 10px; margin-bottom: 5px; }
        .item { border-left: 5px solid var(--k-color); padding-left: 10px; }
        .label { font-size: 10px; color: #666; font-weight: 800; display: block; }
        .val { font-size: 16px; font-weight: 900; color: #000; }
        .footer-comment { border-top: 4px solid #000; padding: 12px 25px; background: #fff; font-size: 18px; font-weight: 800; }

        /* 入力パネル：余白の規律 */
        .panel { 
            width: 100%; flex-grow: 1; overflow-y: auto; background: #111; padding: 25px 20px; 
            box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; /* 全体の間隔を広げた */
        }
        .input-block { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
        
        .check-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #222; padding: 15px; border-radius: 8px; }
        .check-grid label { display: flex; align-items: center; color: #fff; font-size: 13px; cursor: pointer; }
        .check-grid input { width: 18px; height: 18px; margin-right: 8px; }
        
        label.g-title { font-size: 12px; font-weight: 900; color: var(--k-color); border-left: 4px solid var(--k-color); padding-left: 10px; margin-bottom: 5px; }
        input, select, textarea { padding: 14px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; width: 100%; box-sizing: border-box; }
        
        .save-btn { padding: 20px; background: #e60012; color: #fff; border: none; font-weight: 900; cursor: pointer; border-radius: 12px; font-size: 18px; margin: 20px 0 50px 0; }

        /* 横画面 */
        @media screen and (orientation: landscape) {
            body { flex-direction: row; }
            .card-container { width: 50%; height: 100vh; border-bottom: none; border-right: 3px solid #444; }
            .panel { width: 50%; height: 100vh; }
        }
    </style>
</head>
<body>

<div class="card-container">
    <div id="card-wrap">
        <div class="lane-box" id="out-no">1</div>
        <div class="main-content">
            <div class="header">
                <div class="icon-frame"><img id="preview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ccc' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"></div>
                <div class="name-area"><h1 id="out-name">お名前</h1><div class="sub-info"><span id="out-exp">歴: ---</span> / <span id="out-sns1"></span></div></div>
            </div>
            <div class="data-grid">
                <div class="category-label">戦術 & 属性</div>
                <div class="item"><span class="label">好きな脚質 / 推し選手</span><div class="val" id="out-style-fav">---</div></div>
                <div class="item"><span class="label">推しライン</span><div class="val" id="out-line">---</div></div>
                <div class="item"><span class="label">主戦場 (BANK)</span><div class="val" id="out-bank">---</div></div>
                <div class="item"><span class="label">車券戦術 (STYLE)</span><div class="val" id="out-bet">---</div></div>
                <div class="category-label">戦域 (TARGET RACES)</div>
                <div class="item"><span class="label">時間帯</span><div class="val" id="out-time">---</div></div>
                <div class="item"><span class="label">格 (GRADE)</span><div class="val" id="out-grade">---</div></div>
            </div>
            <div class="footer-comment">
                <span id="out-comment">...よろしくお願いします</span>
            </div>
        </div>
    </div>
</div>

<div class="panel">
    <div class="input-block">
        <label class="g-title">色選択</label>
        <div class="lane-selector">
            <div class="c-btn" style="background:#fff; color:#000" onclick="chgLane(1,'#fff','#000')">1</div>
            <div class="c-btn" style="background:#000; color:#fff" onclick="chgLane(2,'#000','#fff')">2</div>
            <div class="c-btn" style="background:#f00; color:#fff" onclick="chgLane(3,'#f00','#fff')">3</div>
            <div class="c-btn" style="background:#00f; color:#fff" onclick="chgLane(4,'#00f','#fff')">4</div>
            <div class="c-btn" style="background:#dcb000; color:#000" onclick="chgLane(5,'#dcb000','#000')">5</div>
            <div class="c-btn" style="background:#080; color:#fff" onclick="chgLane(6,'#080','#fff')">6</div>
            <div class="c-btn" style="background:#f80; color:#fff" onclick="chgLane(7,'#f80','#fff')">7</div>
            <div class="c-btn" style="background:#fbc; color:#000" onclick="chgLane(8,'#fbc','#000')">8</div>
            <div class="c-btn" style="background:#808; color:#fff" onclick="chgLane(9,'#808','#fff')">9</div>
        </div>
    </div>
    
    <div class="input-block">
        <label class="g-title">プロフィール</label>
        <input type="file" accept="image/*" onchange="loadImg(event)" style="margin-bottom:8px;">
        <input type="text" id="in-n" placeholder="お名前" oninput="upd()" style="margin-bottom:8px;">
        <input type="text" id="in-exp" placeholder="競輪歴" oninput="upd()">
    </div>
    
    <div class="input-block">
        <label class="g-title">脚質 & 属性</label>
        <select id="in-style" onchange="upd()" style="margin-bottom:8px;">
            <option value="---">脚質を選択</option>
            <option value="逃げ">逃げ</option>
            <option value="捲り">捲り</option>
            <option value="差し">差し</option>
            <option value="マーク">マーク</option>
        </select>
        <input type="text" id="in-fav" placeholder="推し選手" oninput="upd()" style="margin-bottom:8px;">
        <input type="text" id="in-line" placeholder="推しライン" oninput="upd()" style="margin-bottom:8px;">
        <input type="text" id="in-bank" placeholder="好きなバンク" oninput="upd()">
    </div>

    <div class="input-block">
        <label class="g-title">グレード</label>
        <div class="check-grid" id="grade-grp">
            <label><input type="checkbox" value="GP" onchange="upd()">GP</label><label><input type="checkbox" value="G1" onchange="upd()">G1</label><label><input type="checkbox" value="G2" onchange="upd()">G2</label><label><input type="checkbox" value="G3" onchange="upd()">G3</label><label><input type="checkbox" value="F1" onchange="upd()">F1</label><label><input type="checkbox" value="F2" onchange="upd()">F2</label>
        </div>
    </div>

    <textarea id="in-com" placeholder="一言メッセージ..." oninput="upd()"></textarea>
    <button class="save-btn" onclick="save()">画像化して保存する📸</button>
</div>

<script>
    function adjustScale() {
        const container = document.querySelector('.card-container');
        const card = document.getElementById('card-wrap');
        const isLandscape = window.innerWidth > window.innerHeight;
        const scale = isLandscape ? (container.offsetHeight * 0.9) / 580 : (container.offsetWidth * 0.9) / 850;
        card.style.transform = `scale(${Math.min(scale, 1)})`;
    }
    window.addEventListener('resize', adjustScale);
    window.addEventListener('load', adjustScale);

    function chgLane(no, bg, txt) { document.documentElement.style.setProperty('--k-color', bg); document.documentElement.style.setProperty('--txt-color', txt); document.getElementById('out-no').innerText = no; }
    function loadImg(e) { document.getElementById('preview').src = URL.createObjectURL(e.target.files[0]); }
    function upd() {
        document.getElementById('out-name').innerText = document.getElementById('in-n').value || "お名前";
        document.getElementById('out-exp').innerText = "歴: " + (document.getElementById('in-exp').value || "---");
        document.getElementById('out-style-fav').innerText = document.getElementById('in-style').value + " / " + (document.getElementById('in-fav').value || "---");
        document.getElementById('out-line').innerText = document.getElementById('in-line').value || "---";
        document.getElementById('out-bank').innerText = document.getElementById('in-bank').value || "---";
        document.getElementById('out-comment').innerText = document.getElementById('in-com').value || "...よろしくお願いします";
        const gs = Array.from(document.querySelectorAll('#grade-grp input:checked')).map(c => c.value);
        document.getElementById('out-grade').innerText = gs.length ? gs.join('/') : "---";
    }
    function save() { 
        html2canvas(document.querySelector("#card-wrap"), { scale: 3, useCORS: true, width: 850, height: 580 }).then(canvas => {
            const link = document.createElement('a'); link.download = 'keirin-card-v2.png'; link.href = canvas.toDataURL(); link.click();
        });
    }
</script>
</body>
</html>
