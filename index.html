<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --k-color: #e60012; --txt-color: #fff; }
        body { background: #1a1a1a; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* カード本体 */
        #card-wrap { width: 800px; height: 450px; background: #fff; border: 5px solid #000; overflow: hidden; position: relative; color: #000; display: grid; grid-template-columns: 90px 1fr; }

        /* 左端：車番 */
        .lane-box { background: var(--k-color); color: var(--txt-color); display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 900; border-right: 5px solid #000; z-index: 5; }

        /* メインエリア */
        .main-content { position: relative; display: grid; grid-template-rows: 150px 1fr; background: #fff; }
        
        /* アイコン＋名前エリア */
        .profile-header { display: flex; align-items: center; padding: 0 30px; border-bottom: 5px solid #000; z-index: 2; gap: 20px; }
        
        /* アイコン：車番カラーの縁取り */
        .icon-frame { width: 100px; height: 100px; border-radius: 50%; border: 5px solid var(--k-color); overflow: hidden; background: #eee; flex-shrink: 0; }
        .icon-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        .name-box h1 { margin: 0; font-size: 48px; letter-spacing: -1px; text-transform: uppercase; font-weight: 800; }

        /* データグリッド */
        .data-grid { padding: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; z-index: 2; }
        .item { border-left: 6px solid var(--k-color); padding-left: 15px; }
        .label { font-size: 11px; color: #888; font-weight: bold; }
        .val { font-size: 24px; font-weight: bold; margin-top: 2px; }

        /* 操作パネル */
        .panel { width: 800px; margin-top: 20px; background: #f5f5f5; color: #333; padding: 25px; border-radius: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .lane-selector { grid-column: span 2; display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
        .c-btn { height: 45px; cursor: pointer; border: 2px solid #000; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .save-btn { grid-column: span 2; padding: 18px; background: #000; color: #fff; border: none; cursor: pointer; font-size: 18px; font-weight: bold; }
        input, select { padding: 10px; border: 2px solid #ddd; border-radius: 5px; }
    </style>
</head>
<body>

<div id="card-wrap">
    <div class="lane-box" id="out-no">3</div>
    <div class="main-content">
        <div class="profile-header">
            <div class="icon-frame"><img id="preview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ccc' d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E"></div>
            <div class="name-box"><h1 id="out-n">Alphabet</h1></div>
        </div>
        <div class="data-grid">
            <div class="item"><span class="label">PROFILE</span><div class="val" id="out-p">Guest / ?</div></div>
            <div class="item"><span class="label">FAVORITE</span><div class="val" id="out-f">---</div></div>
            <div class="item"><span class="label">STYLE</span><div class="val" id="out-s">---</div></div>
            <div class="item"><span class="label">HOME</span><div class="val" id="out-h">---</div></div>
        </div>
    </div>
</div>

<div class="panel">
    <div class="lane-selector">
        <div class="c-btn" style="background:#fff; color:#000" onclick="chg(1,'#fff','#000')">1</div>
        <div class="c-btn" style="background:#000; color:#fff" onclick="chg(2,'#000','#fff')">2</div>
        <div class="c-btn" style="background:#f00; color:#fff" onclick="chg(3,'#f00','#fff')">3</div>
        <div class="c-btn" style="background:#00f; color:#fff" onclick="chg(4,'#00f','#fff')">4</div>
        <div class="c-btn" style="background:#ff0; color:#000" onclick="chg(5,'#ff0','#000')">5</div>
        <div class="c-btn" style="background:#080; color:#fff" onclick="chg(6,'#080','#fff')">6</div>
        <div class="c-btn" style="background:#f80; color:#fff" onclick="chg(7,'#f80','#fff')">7</div>
        <div class="c-btn" style="background:#fbc; color:#000" onclick="chg(8,'#fbc','#000')">8</div>
        <div class="c-btn" style="background:#808; color:#fff" onclick="chg(9,'#808','#fff')">9</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
        <label>アイコン選択</label>
        <input type="file" accept="image/*" onchange="loadFile(event)">
        <label>性別</label>
        <select id="in-g" onchange="autoFillName()">
            <option value="?">選択</option>
            <option value="♂">男性 (John Doe)</option>
            <option value="♀">女性 (Jane Doe)</option>
        </select>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px;">
        <label>名前</label>
        <input type="text" id="in-n" value="Alphabet" oninput="manualName()">
        <label>推し / 脚質</label>
        <input type="text" placeholder="推し / 脚質" oninput="updAll(this.value)">
    </div>
    <button class="save-btn" onclick="save()">画像を保存するじゃ！！🫵</button>
</div>

<script>
    let isManual = false;
    function chg(no, bg, txt) {
        document.documentElement.style.setProperty('--k-color', bg);
        document.documentElement.style.setProperty('--txt-color', txt);
        document.getElementById('out-no').innerText = no;
    }
    function loadFile(event) {
        const output = document.getElementById('preview');
        output.src = URL.createObjectURL(event.target.files[0]);
    }
    function autoFillName() {
        const g = document.getElementById('in-g').value;
        const nInput = document.getElementById('in-n');
        document.getElementById('out-p').innerText = (g === '♂' ? 'John Doe / ♂' : g === '♀' ? 'Jane Doe / ♀' : 'Guest / ?');
        if (!isManual) {
            let name = (g === '♂' ? 'John Doe' : g === '♀' ? 'Jane Doe' : 'Alphabet');
            nInput.value = name;
            document.getElementById('out-n').innerText = name;
        }
    }
    function manualName() { isManual = true; document.getElementById('out-n').innerText = document.getElementById('in-n').value; }
    function updAll(v) { document.getElementById('out-f').innerText = v; }
    function save() {
        html2canvas(document.querySelector("#card-wrap"), { scale: 2, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'keirin-card.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>

</body>
</html>
