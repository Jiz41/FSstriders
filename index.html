<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --k-color: #e60012; --txt-color: #fff; }
        body { background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; font-family: sans-serif; }
        
        /* カード全体 */
        #card-wrap { width: 800px; height: 450px; background: #fff; border: 4px solid #000; overflow: hidden; position: relative; color: #000; display: grid; grid-template-columns: 80px 1fr; }

        /* 左端：車番エリア */
        .lane-box { background: var(--k-color); color: var(--txt-color); display: flex; align-items: center; justify-content: center; font-size: 70px; font-weight: bold; border-right: 4px solid #000; z-index: 10; }

        /* 右側：メインコンテンツ */
        .main-content { position: relative; display: grid; grid-template-rows: 140px 1fr; }
        
        /* 選手シルエット（SVGを絶対配置） */
        .silhouette-svg { position: absolute; right: -20px; bottom: -40px; width: 500px; height: auto; opacity: 0.15; fill: var(--k-color); z-index: 1; pointer-events: none; }

        .name-area { padding: 30px; border-bottom: 4px solid #000; z-index: 2; }
        .name-area h1 { margin: 0; font-size: 60px; letter-spacing: -2px; }
        
        .data-grid { padding: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; z-index: 2; }
        .item { border-left: 5px solid var(--k-color); padding-left: 15px; }
        .label { font-size: 12px; color: #666; font-weight: bold; }
        .val { font-size: 22px; font-weight: bold; }

        /* 操作パネル */
        .panel { width: 800px; margin-top: 20px; background: #eee; color: #333; padding: 20px; border-radius: 8px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
        .c-btn { height: 40px; cursor: pointer; border: 2px solid #000; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .save-btn { grid-column: span 9; margin-top: 15px; padding: 15px; background: #000; color: #fff; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="card-wrap">
    <div class="lane-box" id="out-no">3</div>
    <div class="main-content">
        <svg class="silhouette-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <path d="M430,230c-15-50-60-80-110-85l-40-5c-20-2-40,10-45,30l-10,40l-80,10c-15,2-25,15-22,30s15,25,30,22l70-10l5,40c2,15,15,25,30,22s25-15,22-30l-5-40l30,5c30,5,55,25,65,55l10,30h50L430,230z M150,350c-40,0-75,35-75,75s35,75,75,75s75-35,75-75S190,350,150,350z M150,470c-25,0-45-20-45-45s20-45,45-45s45,20,45,45S175,470,150,470z M380,350c-40,0-75,35-75,75s35,75,75,75s75-35,75-75S420,350,380,350z M380,470c-25,0-45-20-45-45s20-45,45-45s45,20,45,45S405,470,380,470z"/>
        </svg>

        <div class="name-area">
            <h1 id="out-n">Alphabet</h1>
        </div>
        <div class="data-grid">
            <div class="item"><span class="label">PROFILE</span><div class="val" id="out-p">John Doe / ♂</div></div>
            <div class="item"><span class="label">FAVORITE</span><div class="val">脇本 雄太</div></div>
            <div class="item"><span class="label">HISTORY</span><div class="val">15 Years</div></div>
            <div class="item"><span class="label">STYLE</span><div class="val">捲り・追込</div></div>
        </div>
    </div>
</div>

<div class="panel">
    <div class="c-btn" style="background:#fff; color:#000" onclick="chg(1,'#fff','#000')">1</div>
    <div class="c-btn" style="background:#000; color:#fff" onclick="chg(2,'#000','#fff')">2</div>
    <div class="c-btn" style="background:#f00; color:#fff" onclick="chg(3,'#f00','#fff')">3</div>
    <div class="c-btn" style="background:#00f; color:#fff" onclick="chg(4,'#00f','#fff')">4</div>
    <div class="c-btn" style="background:#ff0; color:#000" onclick="chg(5,'#ff0','#000')">5</div>
    <div class="c-btn" style="background:#080; color:#fff" onclick="chg(6,'#080','#fff')">6</div>
    <div class="c-btn" style="background:#f80; color:#fff" onclick="chg(7,'#f80','#fff')">7</div>
    <div class="c-btn" style="background:#fbc; color:#000" onclick="chg(8,'#fbc','#000')">8</div>
    <div class="c-btn" style="background:#808; color:#fff" onclick="chg(9,'#808','#fff')">9</div>
    <button class="save-btn" onclick="save()">Download PNG</button>
</div>

<script>
    function chg(no, bg, txt) {
        document.documentElement.style.setProperty('--k-color', bg);
        document.documentElement.style.setProperty('--txt-color', txt);
        document.getElementById('out-no').innerText = no;
    }
    function save() {
        html2canvas(document.querySelector("#card-wrap")).then(canvas => {
            const link = document.createElement('a');
            link.download = 'keirin-profile.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>

</body>
</html>
