<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>KEIRIN Profile Card Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --k-color: #f00; --t-color: #fff; }
        body { font-family: 'Arial', sans-serif; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* カード本体 (16:9) */
        #card-wrap { width: 800px; height: 450px; padding: 10px; background: #000; }
        #card {
            width: 100%; height: 100%; background: linear-gradient(135deg, #111 0%, #333 100%);
            border: 6px solid var(--k-color); position: relative; overflow: hidden;
            display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; padding: 30px; box-sizing: border-box;
        }

        /* シルエット (仮) */
        .sh { position: absolute; left: -20px; bottom: -20px; width: 350px; height: 350px; 
              background: var(--k-color); opacity: 0.2; clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%); z-index: 1; }

        .content { z-index: 2; }
        h1 { font-size: 3em; margin: 0; color: var(--k-color); text-transform: uppercase; }
        .tag-area { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .tag { border: 1px solid var(--k-color); padding: 4px 10px; font-size: 0.8em; border-radius: 4px; background: rgba(0,0,0,0.3); }
        
        /* 操作パネル */
        #panel { width: 800px; background: #eee; color: #333; padding: 20px; border-radius: 8px; margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .c-btns { display: flex; gap: 4px; margin-top: 5px; }
        .c-btn { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 1px solid #999; }
        input, select, textarea { width: 100%; margin-bottom: 10px; }
        #save-btn { grid-column: span 2; padding: 15px; background: #333; color: #fff; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>

<div id="card-wrap">
    <div id="card">
        <div class="sh"></div>
        <div class="content">
            <h1 id="out-n">Alphabet</h1>
            <p id="out-g">♂ / ♀ / ?</p>
            <p>History: <span id="out-h">---</span></p>
            <p style="margin-top:20px;">Favorite Player:<br><strong id="out-f">---</strong></p>
        </div>
        <div class="content">
            <p>Style / Line</p>
            <div id="out-s" class="tag-area"></div>
            <p style="margin-top:20px;">Main Field (Grade / Time)</p>
            <div id="out-b" class="tag-area"></div>
            <p style="margin-top:20px;">Message</p>
            <p id="out-m" style="font-size:0.9em; font-style: italic;">Welcome to Keirin world.</p>
        </div>
    </div>
</div>

<div id="panel">
    <div>
        <strong>1. Color (車番)</strong>
        <div class="c-btns">
            <div class="c-btn" style="background:#fff" onclick="chgC('#fff')"></div>
            <div class="c-btn" style="background:#000" onclick="chgC('#000')"></div>
            <div class="c-btn" style="background:#f00" onclick="chgC('#f00')"></div>
            <div class="c-btn" style="background:#00f" onclick="chgC('#00f')"></div>
            <div class="c-btn" style="background:#ff0" onclick="chgC('#ff0')"></div>
            <div class="c-btn" style="background:#080" onclick="chgC('#080')"></div>
            <div class="c-btn" style="background:#f80" onclick="chgC('#f80')"></div>
            <div class="c-btn" style="background:#fbc" onclick="chgC('#fbc')"></div>
            <div class="c-btn" style="background:#808" onclick="chgC('#808')"></div>
        </div>
        <br>
        <strong>2. Profile</strong><br>
        Name: <input type="text" id="in-n" placeholder="Alphabet" oninput="upd()">
        Gender: <select id="in-g" onchange="updG()">
            <option value="?">?</option>
            <option value="♂">Male (John Doe)</option>
            <option value="♀">Female (Jane Doe)</option>
        </select>
        History: <input type="text" id="in-h" placeholder="5 years" oninput="upd()">
    </div>
    <div>
        <strong>3. Detail</strong><br>
        Favorite Player: <input type="text" id="in-f" oninput="upd()">
        Message: <textarea id="in-m" oninput="upd()"></textarea>
    </div>
    <button id="save-btn" onclick="save()">Download Card (.png)</button>
</div>

<script>
    let customName = false;
    function chgC(c) { document.documentElement.style.setProperty('--k-color', c); }
    function updG() {
        const g = document.getElementById('in-g').value;
        const nInput = document.getElementById('in-n');
        document.getElementById('out-g').innerText = g;
        if(!customName) {
            let n = "Alphabet";
            if(g === "♂") n = "John Doe";
            if(g === "♀") n = "Jane Doe";
            nInput.value = n;
            document.getElementById('out-n').innerText = n;
        }
    }
    function upd() {
        const n = document.getElementById('in-n').value;
        if(n !== "Alphabet" && n !== "John Doe" && n !== "Jane Doe") customName = true;
        document.getElementById('out-n').innerText = n || "Alphabet";
        document.getElementById('out-h').innerText = document.getElementById('in-h').value || "---";
        document.getElementById('out-f').innerText = document.getElementById('in-f').value || "---";
        document.getElementById('out-m').innerText = document.getElementById('in-m').value || "Welcome to Keirin world.";
    }
    function save() {
        html2canvas(document.querySelector("#card-wrap")).then(canvas => {
            const link = document.createElement('a');
            link.download = 'keirin-card.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
